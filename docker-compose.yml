services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
  streamlit:
    build: .
    command: streamlit run frontend/streamlit_app.py --server.address=0.0.0.0
    ports: ["8501:8501"]
    depends_on: [api]
    volumes:
      - ./data:/app/data
      - ./models:/app/models
  mlflow-ui:
    build: .
    command: mlflow ui --backend-store-uri sqlite:///mlflow.db --default-artifact-root /app/mlruns --host 0.0.0.0 --port 5000
    ports: ["5000:5000"]
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
